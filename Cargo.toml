[package]
name = "envcat"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity AI <agy@deepmind.com>"]
description = "Modern Terminal Environment & Config File Inspector, Secret Masker, Diff Engine, Validator, and TUI"

[lib]
name = "envcat"
path = "src/lib.rs"

[[bin]]
name = "envcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
configparser = "3.1"
regex = "1.10"
terminal_size = "0.3"
crossterm = "0.27"
ratatui = "0.26"
comfy-table = { version = "7.1", features = ["custom_styling"] }
colored = "2.1"
anyhow = "1.0"
chrono = "0.4"
